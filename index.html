
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nutquacker | Ballerina Turkey</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <p class="eyebrow">The Thanksgiving Ballet Company</p>
        <h1>The Nutquacker</h1>
        <p class="subtitle">A turkey's debut on pointe</p>
    </header>

    <main class="stage">

        <div class="curtain left-curtain"></div>
        <div class="curtain right-curtain"></div>
        <div class="spotlight"></div>
        <div class="floor"></div>

        <div class="sparkle sparkle-one">✧</div>
        <div class="sparkle sparkle-two">✦</div>
        <div class="sparkle sparkle-three">✧</div>
        <div class="sparkle sparkle-four">✦</div>

        <div class="turkey">

            <!-- Original turkey feathers -->
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>
            <div class="tail"></div>

            <!-- Original turkey body parts -->
            <div class="leg"></div>
            <div class="leg"></div>

            <div class="body"></div>

            <div class="wing"></div>
            <div class="wing"></div>

            <!-- Ballerina costume -->
            <div class="leotard"></div>
            <div class="tutu-back"></div>
            <div class="tutu-front"></div>
            <div class="waistband"></div>

            <div class="bow">
                <div class="bow-left"></div>
                <div class="bow-right"></div>
                <div class="bow-center"></div>
            </div>

            <!-- Turkey face -->
            <div class="head">
                <div class="eye"></div>
                <div class="beak"></div>
                <div class="red"></div>
                <div class="blush"></div>
            </div>

            <!-- Original hat redesigned as tiara -->
            <div class="hat-top"></div>
            <div class="hat-bottom"></div>
            <div class="gem"></div>

            <!-- Ballet slippers -->
            <div class="slipper slipper-left"></div>
            <div class="slipper slipper-right"></div>

        </div>

    </main>

    <footer>
        <p>ACT I &nbsp; · &nbsp; THE LAST DANCE BEFORE DINNER</p>
        <span>Hover over the turkey for a little magic ✧</span>
    </footer>

</body>

</html>
